name: 비서실 주간 성적표

on:
  schedule:
    - cron: "0 11 * * 0"   # 일요일 20:00 (한국시간) KDP 판매 숫자 버튼으로 묻기
    - cron: "0 22 * * 0"   # 월요일 07:00 (한국시간) 성적표 보내기
  workflow_dispatch:
    inputs:
      mode:
        description: "now = 지금 성적표 보내기, ask = KDP 판매 묻기"
        default: now

concurrency:
  group: secretary-report
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: KDP 판매 묻기
        if: github.event.schedule == '0 11 * * 0' || inputs.mode == 'ask'
        run: python hub/bot.py --ask-kdp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 카드 그리기 준비 (한글 글꼴 + 브라우저)
        if: github.event.schedule != '0 11 * * 0' && inputs.mode != 'ask'
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y fonts-nanum > /dev/null
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - name: 성적표 보내기
        if: github.event.schedule != '0 11 * * 0' && inputs.mode != 'ask'
        run: python hub/weekly.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_ACTIONS_TOKEN: ${{ secrets.STOCK_ACTIONS_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
