name: 비서실 봇 (버튼 처리)

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 확인 (공개 저장소라 무료. GitHub 사정으로 늦을 수 있음)
    # 승인 요청을 보내면 15분, 버튼을 누르면 10분 동안 '듣기 모드'로 바로바로 반응
  workflow_dispatch:
    inputs:
      hello:
        description: "설치 확인 메시지 보내기 (yes)"
        default: "no"
      listen:
        description: "몇 분 동안 바로바로 반응할지 (0 = 한 번만 확인)"
        default: "0"
      reask:
        description: "다시 보낼 승인 요청 이름 (쉼표로 여러 개)"
        default: ""
      update:
        description: "웹훅이 넘겨준 텔레그램 소식(JSON) 하나 — 보통 비워 둠"
        default: ""

concurrency:
  group: secretary
  cancel-in-progress: false

permissions:
  contents: write   # 승인 결과·읽은 위치 기록
  actions: write    # 버튼을 누르면 다음 단계 워크플로 실행

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hub/bot.py ${{ inputs.hello == 'yes' && '--hello' || '' }} --listen=${{ inputs.listen || '0' }} --reask=${{ inputs.reask }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_ACTIONS_TOKEN: ${{ secrets.STOCK_ACTIONS_TOKEN }}
          UPDATE_JSON: ${{ inputs.update }}
          GITHUB_TOKEN: ${{ github.token }}
