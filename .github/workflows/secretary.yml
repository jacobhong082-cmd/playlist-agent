name: 비서실 봇 (버튼 처리)

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 (공개 저장소라 무료. GitHub 사정으로 조금 늦을 수 있음)
  workflow_dispatch:
    inputs:
      hello:
        description: "설치 확인 메시지 보내기 (yes)"
        default: "no"

concurrency:
  group: secretary
  cancel-in-progress: false

permissions:
  contents: write   # 승인 결과·읽은 위치 기록
  actions: write    # 버튼을 누르면 다음 단계 워크플로 실행

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: hub
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python hub/bot.py ${{ inputs.hello == 'yes' && '--hello' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_ACTIONS_TOKEN: ${{ secrets.STOCK_ACTIONS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
