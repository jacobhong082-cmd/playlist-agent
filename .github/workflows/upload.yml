name: 플레이리스트 유튜브 올리기 (승인 버튼)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "영상을 만든 실행 번호"
        required: true
      episode:
        default: "ep01"
      choice:
        description: "approve / redo / drop"
        default: "approve"

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: hub_main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - uses: actions/download-artifact@v4
        if: inputs.choice == 'approve'
        with:
          name: ${{ inputs.episode }}-video
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ep
      - name: 올리기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python music/upload_episode.py ep "${{ inputs.choice }}"
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: cd hub_main/hub && python -c "import secretary as s; s.fail('playlist', '유튜브 올리기', '업로드 중 오류가 났어요. Claude가 확인 중이에요.')"
