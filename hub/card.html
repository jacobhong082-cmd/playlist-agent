<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{{font-family:DMS;src:url(fonts/DMSerifDisplay-normal.ttf)}}
@font-face{{font-family:DMS;font-style:italic;src:url(fonts/DMSerifDisplay-italic.ttf)}}
:root{{--paper:#f6f4ea;--ink:#1f2a22;--line:#dfe1d2;--acc:#2f5d46;--mute:#7a8274;--track:#e4e7da}}
*{{box-sizing:border-box;margin:0;padding:0}}
body{{background:#cfd5c8;padding:0;font-family:"NanumGothic","Nanum Gothic",sans-serif;color:var(--ink)}}
.sheet{{width:540px;background:var(--paper);padding:34px 32px 24px;border:1px solid var(--line)}}
.MJ{{font-family:"NanumMyeongjo","Nanum Myeongjo",serif}}
.hd{{display:flex;justify-content:space-between;align-items:baseline}}
.eyebrow{{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--acc)}}.date{{font-size:12px;color:var(--mute)}}
.ttl{{font-family:"NanumMyeongjo","Nanum Myeongjo",serif;font-weight:800;font-size:30px;margin:8px 0 20px;border-bottom:2px solid var(--ink);padding-bottom:14px}}
.hero{{display:grid;grid-template-columns:1fr 1fr 1fr;margin-bottom:20px}}
.h{{border-right:1px solid var(--line);padding:0 10px}}.h:first-child{{padding-left:0}}.h:last-child{{border:0}}
.l{{font-size:11.5px;color:var(--mute)}}
.v{{font-family:DMS;font-size:38px;line-height:1.1;margin-top:6px}}
.c{{font-size:12px;font-weight:700;margin-top:4px;color:var(--acc)}}
.sec{{font-size:11px;letter-spacing:.16em;font-weight:700;margin:16px 0 10px;color:var(--acc)}}
.pg{{display:grid;grid-template-columns:78px 1fr 120px;align-items:center;gap:10px;font-size:13px;margin-bottom:8px}}
.pg span{{font-family:"NanumMyeongjo","Nanum Myeongjo",serif}}.pg b{{text-align:right;font-size:12px}}
.tr{{height:6px;border-radius:3px;overflow:hidden;background:var(--track)}}.tr i{{display:block;height:100%;border-radius:3px;background:var(--acc)}}
.row4{{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}}
.m{{border-top:1px solid var(--ink);padding-top:8px}}.v2{{font-family:DMS;font-size:22px;margin-top:3px}}
.vd{{font-family:"NanumMyeongjo","Nanum Myeongjo",serif;font-size:13.5px;line-height:1.55}}
.vd div{{padding:8px 0;border-top:1px solid var(--line);display:flex}}
.vd em{{font-style:normal;font-weight:700;font-size:11.5px;flex:0 0 64px;color:var(--acc);font-family:"NanumGothic","Nanum Gothic",sans-serif;padding-top:2px}}
.ft{{font-size:10.5px;margin-top:14px;text-align:right;color:var(--mute)}}
</style></head><body><div class="sheet">
<div class="hd"><div class="eyebrow">WEEKLY REPORT</div><div class="date">{range}</div></div>
<div class="ttl">이번 주 성적표</div>
<div class="hero">
 <div class="h"><div class="l">유튜브 조회수</div><div class="v">{views}</div><div class="c">{views_d}</div></div>
 <div class="h"><div class="l">구독자</div><div class="v">{subs}</div><div class="c">{subs_d}</div></div>
 <div class="h"><div class="l">KDP 판매</div><div class="v">{kdp}</div><div class="c">{kdp_d}</div></div>
</div>
<div class="sec">수익화까지</div>
<div class="pg"><span>구독자</span>{subs_bar}<b>{subs_txt}</b></div>
<div class="pg"><span>시청 시간</span>{hours_bar}<b>{hours_txt}</b></div>
<div class="pg"><span>KDP 로열티</span>{roy_bar}<b>{roy_txt}</b></div>
<div class="sec">에이전트 · 쓴 돈</div>
<div class="row4">
 <div class="m"><div class="l">성공률</div><div class="v2">{rate}</div></div>
 <div class="m"><div class="l">실행</div><div class="v2">{runs}</div></div>
 <div class="m"><div class="l">실패</div><div class="v2">{fails}</div></div>
 <div class="m"><div class="l">쓴 돈</div><div class="v2">0원</div></div>
</div>
<div class="sec">판정</div>
<div class="vd"><div><em>키울 것</em><span>{grow}</span></div><div><em>접을 것</em><span>{drop}</span></div><div><em>내 할 일</em><span>{todo}</span></div></div>
<div class="ft">비서실 · 매주 월 07:00 자동 발송</div>
</div></body></html>
